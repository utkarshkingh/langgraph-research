# Local copy of the production setup: two services + Postgres (one database each).
#   docker compose up --build
#   python demo.py --running
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 15

  research_agent:
    build:
      context: .
      args: { SERVICE: research_agent, PORT: "8001" }
    environment:
      RESEARCH_AGENT_URL: http://research_agent:8001   # the URL in its agent card
      POSTGRES_DSN: postgresql://app:app@postgres:5432/research
    ports: ["8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }

  orchestrator:
    build:
      context: .
      args: { SERVICE: orchestrator, PORT: "8000" }
    environment:
      RESEARCH_AGENT_URL: http://research_agent:8001
      POSTGRES_DSN: postgresql://app:app@postgres:5432/orchestrator
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      research_agent: { condition: service_started }
