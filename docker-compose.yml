# Local copy of the production topology: orchestrator + research agent + Postgres.
# Reads .env (copy .env.example). Postgres holds the orchestrator's checkpoints and
# the research agent's A2A tasks.
#
# Real run:      docker compose up --build        (needs the LiteLLM + Tavily values in .env)
# Offline backup: MODEL_BACKEND=scripted SEARCH_BACKEND=mock MCP_ENABLED=false docker compose up --build
#                 (LLM and search are faked, but A2A over HTTP and Postgres checkpoints are real)
services:
  research_agent:
    build:
      context: .
      args:
        SERVICE: research_agent
    env_file: .env
    environment:
      PORT: 8081
      # The address callers use for this agent; it goes into the agent card.
      RESEARCH_AGENT_URL: http://research_agent:8081
      # The A2A task store (the agent keeps a task between gather and finalize).
      POSTGRES_DSN: postgresql://agent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/agent
      MODEL_BACKEND: ${MODEL_BACKEND:-litellm}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-tavily}
      MCP_ENABLED: ${MCP_ENABLED:-true}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      args:
        SERVICE: orchestrator
    env_file: .env
    environment:
      PORT: 8080
      RESEARCH_MODE: http
      RESEARCH_AGENT_URL: http://research_agent:8081
      CHECKPOINT_BACKEND: postgres
      POSTGRES_DSN: postgresql://agent:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/agent
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      research_agent:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent-postgres:
