[project]
name = "langgraph-research"
version = "1.0.0"
description = "Orchestrator + research agent on LangGraph, talking A2A, with human-in-the-loop pause/resume."
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[fastapi]>=1.2,<2",      # official A2A SDK: agent card, JSON-RPC server, client
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.9",            # Entra ID token validation
    "mcp>=1.10,<2",                  # MCP client + server (2.x renamed FastMCP)
]

[project.optional-dependencies]
postgres = [                         # production persistence
    "a2a-sdk[postgresql]>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
]
azure = [                            # production LLM + managed identity
    "langchain-openai>=1.0",
    "azure-identity>=1.17",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "orchestrator", "research_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
