[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Name the packages explicitly; a flat layout with several top-level folders
# otherwise makes setuptools refuse to build.
packages = ["common", "orchestrator", "research_agent", "research_agent.tools"]

[project]
name = "langgraph-hitl-reference"
version = "0.1.0"
description = "Reference implementation of a resumable, human-in-the-loop multi-agent pattern (orchestrator + A2A research agent) on LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
# Production integrations — not needed for the offline local demo.
azure = [
    "langchain-openai>=0.2.0",   # AzureChatOpenAI
    "azure-identity>=1.17.0",    # DefaultAzureCredential (managed identity)
    "PyJWT[crypto]>=2.9.0",      # Entra ID JWT validation (JWKS)
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",    # Postgres driver used by the checkpointer
]
mcp = [
    # MCP client + FastMCP server (Statista-style tool). Pinned to the 1.x SDK:
    # 2.x renamed FastMCP to MCPServer and changed other APIs.
    "mcp>=1.10.0,<2",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
